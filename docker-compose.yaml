services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysql", "-h", "127.0.0.1", "-udev", "-pdev", "-e", "SELECT 1" ]
      interval: 5s
      retries: 30
#--------------------------------------------------------------------------------------------------------------

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false
      AUTH_DB_USERNAME: dev
      AUTH_DB_PASSWORD: dev
      #SPRING_DATASOURCE_USERNAME: dev  #Spring reconoce automáticamente esta variable SPRING_DATASOURCE_USERNAME: y no hace falta declararla en el properties
      #SPRING_DATASOURCE_PASSWORD: dev  #sin embargo al usar un nombre personalizado como AUTH_DB_USERNAME, hay que declarar en el properties.
                                        #explícitamente username: ${AUTH_DB_USERNAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    depends_on:
      mysql:
        condition: service_healthy
#--------------------------------------------------------------------------------------------------------------

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_curso_api?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: dev #Como spring reconoce SPRING_DATASOURCE_USERNAME: no hace falta declarar
      SPRING_DATASOURCE_PASSWORD: dev #en el archivo de configuración .yml o properties.
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
#--------------------------------------------------------------------------------------------------------------

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_DB_USERNAME: dev
      ORDER_DB_PASSWORD: dev
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
 #--------------------------------------------------------------------------------------------------------------

  alloy:
    image: grafana/alloy:v1.13.0
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_INSTANCE_ID: ${GRAFANA_INSTANCE_ID}
      GCLOUD_RW_API_KEY: ${GCLOUD_RW_API_KEY}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
#--------------------------------------------------------------------------------------------------------------

volumes:
  mysql_data:
  alloy_data:
