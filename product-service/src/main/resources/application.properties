spring.application.name=product-service

management.tracing.sampling.probability=1.0

management.otlp.metrics.export.url=http://alloy:4318/v1/metrics
management.otlp.metrics.export.step=10s

management.opentelemetry.tracing.export.otlp.endpoint=http://alloy:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://alloy:4318/v1/logs