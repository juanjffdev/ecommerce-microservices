#Configuración de la base de datos
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS}

management:
  tracing:
    sampling:
      probability: 1.0

  otlp:
    metrics:
      export:
        url: http://alloy:4318/v1/metrics
        step: 10s

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://alloy:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://alloy:4318/v1/logs